<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign up</title><link rel="stylesheet" href="style.css"></head>
<body>
<nav><a href="index.html">Shop</a><a href="signup.html">Sign up</a><a href="order.html">Order</a><a href="support.html">Help</a></nav>
<h1>Open an account</h1>
<form id="signup">
  <label for="email">Email</label><input id="email" name="email">
  <label for="full_name">Full name</label><input id="full_name" name="full_name">
  <label for="phone">Phone</label><input id="phone" name="phone">
  <label for="allergies">Allergies, separated by commas</label><input id="allergies" name="allergies">
  <label for="street">Street</label><input id="street" name="street">
  <label for="city">City</label><input id="city" name="city">
  <label for="postcode">Postcode</label><input id="postcode" name="postcode">
  <button type="submit">Open account</button>
</form>
<p id="signup-message" hidden></p>
<script src="app.js"></script>
</body>
</html>
