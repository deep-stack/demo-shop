name: Tests

on:
  push:
    branches: [main, ci-analytics]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: pip install ruff
      - name: Lint
        run: ruff check --select E9,F .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit tests
        run: pytest tests/unit -v --junitxml=reports/unit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit
          path: reports/

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:shop@localhost:5432/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Create the schema
        run: psql "$DATABASE_URL" -f db/schema.sql
      - name: Integration tests
        run: pytest tests/integration -v --junitxml=reports/integration.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-integration
          path: reports/

  e2e:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: End-to-end tests
        run: pytest tests/e2e -v --junitxml=reports/e2e.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-e2e
          path: reports/
