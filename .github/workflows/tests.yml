name: Tests

on:
  push:
    branches: [main, ci-analytics, ci-kinds]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest ruff
      - run: make check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-check-${{ github.run_attempt }}
          path: reports/

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:shop@localhost:5432/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install and run tests
        run: |
          pip install -r requirements.txt pytest
          ./scripts/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-tests-${{ github.run_attempt }}
          path: reports/

  matrix:
    name: Test ${{ matrix.python }}
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - run: make unit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-unit-${{ matrix.python }}-${{ github.run_attempt }}
          path: reports/
